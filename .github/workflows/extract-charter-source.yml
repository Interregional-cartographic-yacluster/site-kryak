name: Extract charter source text

on:
  push:
    branches:
      - arena/63c8959b-site-kryak
    paths:
      - .github/workflows/extract-charter-source.yml

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/63c8959b-site-kryak

      - name: Download charter PDF
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download archive-files-v1 --pattern archive-ust-01.pdf --dir /tmp

      - name: Extract text
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          mkdir -p working
          pdftotext -layout /tmp/archive-ust-01.pdf working/charter-source.txt
          test -s working/charter-source.txt

      - name: Commit extracted source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add working/charter-source.txt
          git commit -m "Extract charter source text"
          git push origin HEAD:arena/63c8959b-site-kryak
