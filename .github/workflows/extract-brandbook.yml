name: Extract KRYAK brandbook

on:
  workflow_dispatch:
  push:
    branches:
      - arena/e14c0f6f-site-kryak
    paths:
      - .github/workflows/extract-brandbook.yml

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/e14c0f6f-site-kryak
      - name: Download and extract brandbook
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download archive-files-v1 --pattern archive-054.pdf --dir /tmp
          ls -lh /tmp/archive-054.pdf
          file /tmp/archive-054.pdf
          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/archive-054.pdf')
          print('Header:', p.read_bytes()[:16])
          PY
          sudo apt-get update >/dev/null
          sudo apt-get install -y poppler-utils >/dev/null
          mkdir -p working/brandbook-pages
          pdftotext -layout /tmp/archive-054.pdf working/brandbook.txt
          pdftoppm -png -r 60 -f 1 -l 30 /tmp/archive-054.pdf working/brandbook-pages/page
          test -s working/brandbook.txt
      - name: Commit extracted materials
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add working
          git commit -m "Extract KRYAK brandbook reference"
          git push origin HEAD:arena/e14c0f6f-site-kryak
