name: Extract KRYAK brandbook

on:
  workflow_dispatch:
  push:
    branches:
      - arena/e14c0f6f-site-kryak
    paths:
      - .github/workflows/extract-brandbook.yml

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/e14c0f6f-site-kryak
      - name: Download and extract brandbook
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -H 'Accept: application/octet-stream' \
            repos/Interregional-cartographic-yacluster/site-kryak/releases/assets/767580804 \
            > /tmp/archive-054.pdf
          ls -lh /tmp/archive-054.pdf
          file /tmp/archive-054.pdf
          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/archive-054.pdf')
          print('Header:', p.read_bytes()[:16])
          PY
          mkdir -p working/brandbook-pages
          cp /tmp/archive-054.pdf working/archive-054.bin
          sudo apt-get update >/dev/null
          sudo apt-get install -y poppler-utils >/dev/null
          pdftotext -layout /tmp/archive-054.pdf working/brandbook.txt || true
          pdftoppm -jpeg -jpegopt quality=72 -r 72 -f 1 -l 30 \
            /tmp/archive-054.pdf working/brandbook-pages/page || true
      - name: Commit extracted materials
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add working
          git commit -m "Extract KRYAK brandbook reference"
          git push origin HEAD:arena/e14c0f6f-site-kryak
