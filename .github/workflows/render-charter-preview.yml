name: Render charter preview
on:
  workflow_dispatch:
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libreoffice-writer poppler-utils fonts-roboto
      - run: |
          mkdir -p preview
          libreoffice --headless --convert-to pdf --outdir preview "documents/устав-мх-кряк-проект-новой-редакции.docx"
          pdftoppm -png -f 1 -l 3 -r 110 "preview/устав-мх-кряк-проект-новой-редакции.pdf" preview/page
          pdfinfo "preview/устав-мх-кряк-проект-новой-редакции.pdf" > preview/pdfinfo.txt
      - uses: actions/upload-artifact@v4
        with:
          name: charter-preview
          path: preview/
