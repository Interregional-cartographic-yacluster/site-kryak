name: Публикация сайта на GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4
      - name: Настроить GitHub Pages
        uses: actions/configure-pages@v5
      # По семейному решению КРЯКтику нельзя возвращать на сайт раньше
      # 1 июля 2027 года. Исходники остаются в репозитории, но не входят
      # в публикуемый артефакт. После этой даты подключение выполняется
      # только отдельным осознанным изменением, не автоматически.
      - name: Подготовить публичную версию без КРЯКтики
        run: python3 scripts/build_public_site.py
      - name: Загрузить файлы сайта
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Опубликовать сайт
        id: deployment
        uses: actions/deploy-pages@v4
